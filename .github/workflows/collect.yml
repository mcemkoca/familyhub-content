name: Collect library (weekly, automatic)
# Adds new public-domain audiobooks (LibriVox on archive.org) to content/library.json without an admin step.
# Every change must pass scripts/validate.py (licence, host, age band and word gates) before it is committed;
# then the signed feed is rebuilt and published. Remove an item for good by adding its archive.org id to content/deny.txt.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/librivox.py collect
      - run: python3 scripts/validate.py
      - name: Commit and publish when something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet content/; then echo "nothing new"; exit 0; fi
          git config user.name "familyhub-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/library.json
          git commit -m "Kütüphane: haftalık yeni sesli kitaplar (otomatik)"
          git push
          # pushes made with GITHUB_TOKEN do not start other workflows, so start the publish job explicitly
          gh workflow run publish.yml --ref main
